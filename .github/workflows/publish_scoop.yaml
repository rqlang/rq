name: Publish Scoop Manifest

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      SCOOP_BUCKET_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. 0.8.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-scoop
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUCKET_REPOSITORY: rqlang/scoop-bucket
  SCOOP_INSTALLER_COMMIT: 1e2f334083d609986d8c8bc9e31ae8e87c39fab4

jobs:
  render:
    name: Render Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Reject pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          if [ "$prerelease" = "true" ]; then
            echo "::error::$TAG is a pre-release; only stable releases are published to Scoop"
            exit 1
          fi

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS

      - name: Render manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          deployment/scoop/render-manifest.sh "$TAG" SHA256SUMS > rqlang.json
          cat rqlang.json

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: scoop-manifest
          path: rqlang.json
          if-no-files-found: error

  verify:
    name: Verify on Windows
    needs: render
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: scoop-manifest

      - name: Install Scoop
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ScoopInstaller/Install/$env:SCOOP_INSTALLER_COMMIT/install.ps1" -OutFile $installer
          & $installer -RunAsAdmin
          Join-Path $env:USERPROFILE 'scoop\shims' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install and test manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.render.outputs.version }}
        run: |
          scoop install .\rqlang.json
          if ($LASTEXITCODE -ne 0) { throw "scoop install failed" }
          $output = (rq --version | Out-String).Trim()
          Write-Host $output
          if ($output -cnotmatch "^rq $([regex]::Escape($env:VERSION))$") { throw "rq --version reported '$output', expected 'rq $env:VERSION'" }

  push:
    name: Push to Bucket
    needs: [render, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bucket
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BUCKET_REPOSITORY }}
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket-repo

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: scoop-manifest

      - name: Commit and push manifest
        working-directory: bucket-repo
        env:
          VERSION: ${{ needs.render.outputs.version }}
        run: |
          mkdir -p bucket
          if [ -f bucket/rqlang.json ]; then
            current=$(jq -r .version bucket/rqlang.json)
            if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::bucket/rqlang.json has an invalid version '$current'; fix it in $BUCKET_REPOSITORY before publishing"
              exit 1
            fi
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)
            if [ "$current" != "$VERSION" ] && [ "$newest" = "$current" ]; then
              echo "::notice::Bucket already has $current, newer than $VERSION; leaving it unchanged"
              exit 0
            fi
          fi
          cp ../rqlang.json bucket/rqlang.json
          git add bucket/rqlang.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "rqlang $VERSION"
          git push
