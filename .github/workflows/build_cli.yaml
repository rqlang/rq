name: Build CLI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      cache:
        required: false
        type: boolean
        default: false
    secrets:
      CODE_SIGNING_CERT:
        required: true
      CODE_SIGNING_CERT_PWD:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: rq
            asset_name: rq-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            binary: rq
            asset_name: rq-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rq.exe
            asset_name: rq-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: rq
            asset_name: rq-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rq
            asset_name: rq-macos-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        if: inputs.cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set version in Cargo.toml
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          rm Cargo.toml.bak
          grep '^version' Cargo.toml

      - name: Build (release)
        run: cargo build --release -p rq --target ${{ matrix.target }}

      - name: Check the Linux binary is static
        if: runner.os == 'Linux'
        env:
          BINARY_PATH: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          if readelf -d "${BINARY_PATH}" | grep NEEDED; then
            echo "::error::${BINARY_PATH} links shared libraries"
            exit 1
          fi

      - name: Run the Linux binary on older and musl distributions
        if: runner.os == 'Linux'
        env:
          BINARY_PATH: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          for image in alpine:3.20 debian:11 ubuntu:20.04 rockylinux:8 amazonlinux:2023; do
            version="$(docker run --rm -v "${PWD}/${BINARY_PATH}:/usr/local/bin/rq:ro" "${image}" rq --version)"
            echo "${image}: ${version}"
          done

      - name: Code sign Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_CERT }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PWD }}
          BINARY_PATH: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          $pfxPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath "certificate.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }

          & $signtool.FullName sign /f $pfxPath /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $env:BINARY_PATH

          Remove-Item $pfxPath

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
