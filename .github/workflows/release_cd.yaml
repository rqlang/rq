name: Release CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-cd
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.compute.outputs.base }}
      build: ${{ steps.compute.outputs.build }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version from latest tag
        id: compute
        run: |
          tag=""
          if t=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null); then
            tag="$t"
            base="${tag#v}"
          elif t=$(git describe --tags --abbrev=0 --match "[0-9]*" 2>/dev/null); then
            tag="$t"
            base="$tag"
          fi

          if [ -n "$tag" ]; then
            echo "Found latest tag: $tag (base: $base)"
            build=$(git rev-list "${tag}..HEAD" --count)
          else
            base="0.0.0"
            echo "No version tag found, defaulting to $base"
            build=$(git rev-list HEAD --count)
          fi

          if [ "$build" -eq 0 ]; then
            build=1
          fi

          # Increment minor version for dev builds (next sprint target)
          IFS='.' read -r -a parts <<< "$base"
          if [ "${#parts[@]}" -ge 3 ]; then
            minor="${parts[1]}"
            clean_minor="${minor%%-*}"
            new_minor=$((clean_minor + 1))
            base="${parts[0]}.${new_minor}.0"
            echo "Incremented version base to: $base"
          fi

          version="${base}-dev.${build}"
          echo "base=$base" >> $GITHUB_OUTPUT
          echo "build=$build" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Computed version: $version"

  build-cli:
    name: Build CLI
    needs: version
    uses: ./.github/workflows/build_cli.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      cache: true
    secrets:
      CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT }}
      CODE_SIGNING_CERT_PWD: ${{ secrets.CODE_SIGNING_CERT_PWD }}

  build-extension:
    name: Build VS Code Extension
    needs: version
    uses: ./.github/workflows/build_extension.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: dev
