
name: CLI BVT

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/cli/**'
      - 'src/rq-lib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cli_bvt.yaml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            target_flag: --target x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            target_flag: --target aarch64-unknown-linux-musl
    defaults:
      run:
        working-directory: ./src/cli
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Formatting check
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (debug)
        run: cargo build --verbose ${{ matrix.target_flag }}

      - name: Start echo server
        run: |
          docker run -d --rm --name rq-echo -p 8080:80 ealen/echo-server
          echo "Waiting for echo server to be ready..."
          SERVER_READY=false
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "Echo server is ready!"
              SERVER_READY=true
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 1
          done

          if [ "$SERVER_READY" = false ]; then
            echo "ERROR: Echo server failed to start within 30 seconds"
            docker logs rq-echo || true
            exit 1
          fi

          echo "Testing server response:"
          curl -v http://localhost:8080

      - name: Test (all tests)
        run: cargo test --workspace --verbose ${{ matrix.target_flag }}

      - name: Run the musl binary on older and musl distributions
        if: endsWith(matrix.target, '-musl')
        env:
          BINARY_PATH: ${{ github.workspace }}/target/${{ matrix.target }}/debug/rq
        run: |
          for image in alpine:3.20 debian:11 ubuntu:20.04 rockylinux/rockylinux:8 amazonlinux:2023; do
            version="$(docker run --rm -v "${BINARY_PATH}:/usr/local/bin/rq:ro" "${image}" rq --version)"
            echo "${image}: ${version}"
          done

      - name: Stop echo server
        if: always()
        run: |
          docker ps -a
          docker stop rq-echo || true
