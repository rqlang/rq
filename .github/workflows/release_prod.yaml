name: Release Production

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Read version from release tag
        id: read
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

  build-cli:
    name: Build CLI
    needs: version
    uses: ./.github/workflows/build_cli.yaml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT }}
      CODE_SIGNING_CERT_PWD: ${{ secrets.CODE_SIGNING_CERT_PWD }}

  build-extension:
    name: Build VS Code Extension
    needs: version
    uses: ./.github/workflows/build_extension.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: prod

  publish:
    name: Publish Release Assets
    needs: [build-cli, build-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            case "$name" in
              rq-language-extension-*) cp "$dir"*.vsix dist/ ;;
              *) cp "$dir"rq* "dist/$name" ;;
            esac
          done
          cp dist/rq-linux-x86_64 dist/rq-linux-ubuntu-22.04-x86_64
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-homebrew:
    name: Publish Homebrew Formula
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/publish_homebrew.yaml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
