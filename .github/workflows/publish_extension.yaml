name: Publish Extension to Marketplace

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      MARKETPLACE_PAT:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. 0.8.0)'
        required: true
      dry_run:
        description: 'Find the VSIX without publishing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download VSIX from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p extension-artifact
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.vsix" \
            --dir extension-artifact

      - name: Display downloaded files
        run: ls -R extension-artifact

      - name: Find VSIX file
        id: find_vsix
        run: |
          VSIX_PATH=$(find extension-artifact -name "*.vsix" | head -n 1)
          if [ -z "$VSIX_PATH" ]; then
            echo "No .vsix file found in extension-artifact"
            exit 1
          fi
          echo "Found VSIX: $VSIX_PATH"
          echo "vsix_path=$VSIX_PATH" >> $GITHUB_OUTPUT

      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_PAT }}
          VSIX_PATH: ${{ steps.find_vsix.outputs.vsix_path }}
        run: npx @vscode/vsce publish --packagePath "$VSIX_PATH"
