name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count comments before the review
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          conversation=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'length' | awk '{total += $1} END {print total + 0}')
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq 'length' | awk '{total += $1} END {print total + 0}')
          echo "conversation=$conversation" >> "$GITHUB_OUTPUT"
          echo "inline=$inline" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            This runs headless in CI: nothing re-invokes you once you stop emitting, so a
            background agent's completion notification will never reach you and the review
            would end unfinished. Run every review agent as a blocking Task call, several in
            a single message when you want them to run in parallel, and never launch an async
            or background agent. Do not end your turn before the review comment is posted.
          show_full_output: true
          claude_args: >-
            --allowedTools "Task,Read,Glob,Grep,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git rev-parse:*),Bash(find:*),Bash(ls:*),Bash(cat:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Verify the review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          BEFORE_CONVERSATION: ${{ steps.before.outputs.conversation }}
          BEFORE_INLINE: ${{ steps.before.outputs.inline }}
        run: |
          if [ -z "$EXECUTION_FILE" ]; then
            echo "The action skipped itself without running the review, so there is nothing to verify."
            echo "On a pull request that edits this workflow the action refuses to run until the change is on the default branch."
            exit 0
          fi
          conversation=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'length' | awk '{total += $1} END {print total + 0}')
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq 'length' | awk '{total += $1} END {print total + 0}')
          echo "conversation comments: $BEFORE_CONVERSATION -> $conversation"
          echo "inline comments: $BEFORE_INLINE -> $inline"
          if [ "$conversation" -gt "$BEFORE_CONVERSATION" ] || [ "$inline" -gt "$BEFORE_INLINE" ]; then
            echo "The review posted its findings."
            exit 0
          fi
          echo "::error::The review step exited successfully but posted nothing. With --comment the plugin always comments, even when it finds no issues, so this means the review never reached its final step. Look in the execution log for a turn that ended while waiting on background agents."
          exit 1
