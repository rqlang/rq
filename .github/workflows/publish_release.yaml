name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. 0.8.0)'
        required: true
      dry_run:
        description: 'Render and verify without publishing'
        type: boolean
        default: true
      marketplace:
        description: 'VS Code Marketplace'
        type: boolean
        default: true
      homebrew:
        description: 'Homebrew'
        type: boolean
        default: true
      scoop:
        description: 'Scoop'
        type: boolean
        default: true
      winget:
        description: 'WinGet'
        type: boolean
        default: true
      npm:
        description: 'npm (@rqlang/mcp)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-extension:
    name: Publish Extension
    if: ${{ inputs.marketplace }}
    uses: ./.github/workflows/publish_extension.yaml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}

  publish-homebrew:
    name: Publish Homebrew Formula
    if: ${{ inputs.homebrew }}
    uses: ./.github/workflows/publish_homebrew.yaml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  publish-scoop:
    name: Publish Scoop Manifest
    if: ${{ inputs.scoop }}
    uses: ./.github/workflows/publish_scoop.yaml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

  publish-winget:
    name: Publish WinGet Manifest
    if: ${{ inputs.winget }}
    uses: ./.github/workflows/publish_winget.yaml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}

  publish-npm:
    name: Publish MCP Package
    if: ${{ inputs.npm }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish_npm.yaml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
