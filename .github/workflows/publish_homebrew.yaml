name: Publish Homebrew Formula

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. 0.8.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAP_REPOSITORY: rqlang/homebrew-tap

jobs:
  render:
    name: Render Formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Reject pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          if [ "$prerelease" = "true" ]; then
            echo "::error::$TAG is a pre-release; only stable releases are published to Homebrew"
            exit 1
          fi

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS

      - name: Render formula
        env:
          TAG: ${{ inputs.tag }}
        run: |
          deployment/homebrew/render-formula.sh "$TAG" SHA256SUMS > rqlang.rb
          cat rqlang.rb

      - name: Upload formula
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: rqlang.rb
          if-no-files-found: error

  verify:
    name: Verify on ${{ matrix.os }}
    needs: render
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478

      - name: Download formula
        uses: actions/download-artifact@v8
        with:
          name: homebrew-formula

      - name: Add formula to a local tap
        run: |
          brew tap-new --no-git rqlang/verify
          cp rqlang.rb "$(brew --repository)/Library/Taps/rqlang/homebrew-verify/Formula/"

      - name: Audit formula
        if: matrix.os == 'ubuntu-latest'
        run: brew audit --strict --online rqlang/verify/rqlang

      - name: Install and test formula
        run: |
          brew install rqlang/verify/rqlang
          brew test rqlang/verify/rqlang

  push:
    name: Push to Tap
    needs: [render, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download formula
        uses: actions/download-artifact@v8
        with:
          name: homebrew-formula

      - name: Commit and push formula
        working-directory: tap
        env:
          VERSION: ${{ needs.render.outputs.version }}
        run: |
          mkdir -p Formula
          if [ -f Formula/rqlang.rb ]; then
            current=$(grep -m1 -oE '/releases/download/[^/]+/' Formula/rqlang.rb | cut -d/ -f4)
            current="${current#v}"
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)
            if [ "$current" != "$VERSION" ] && [ "$newest" = "$current" ]; then
              echo "::notice::Tap already has $current, newer than $VERSION; leaving it unchanged"
              exit 0
            fi
          fi
          cp ../rqlang.rb Formula/rqlang.rb
          git add Formula/rqlang.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "rqlang $VERSION"
          git push
