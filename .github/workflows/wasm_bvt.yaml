name: WASM BVT

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/rq-wasm/**'
      - 'src/rq-lib/**'
      - '.github/workflows/wasm_bvt.yaml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Test rq-wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/rq-wasm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rq-wasm/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('src/rq-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all tests)
        run: cargo test --verbose

      - name: Build for wasm32 target
        run: cargo check --target wasm32-unknown-unknown --verbose
